<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <!-- ── Header ── -->
    <header>
      <h1>📝 My Todo App</h1>
      <p class="subtitle">Powered by FastAPI + Vanilla JS</p>
    </header>

    <!-- ── Add / Edit Form ── -->
    <section class="form-card">
      <h2 id="form-title">Add New Todo</h2>

      <form id="todo-form">
        <!-- hidden field to hold the id while editing -->
        <input type="hidden" id="todo-id" />

        <div class="field">
          <label for="title">Title <span class="required">*</span></label>
          <input
            type="text"
            id="title"
            placeholder="What needs to be done?"
            required
            maxlength="200"
          />
        </div>

        <div class="field">
          <label for="description">Description <span class="optional">(optional)</span></label>
          <textarea
            id="description"
            placeholder="Add more details..."
            rows="3"
            maxlength="500"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add Todo</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <!-- ── Filter Tabs ── -->
    <div class="filter-tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="active">Active</button>
      <button class="tab" data-filter="completed">Completed</button>
    </div>

    <!-- ── Todo List ── -->
    <section class="todo-list-section">
      <div id="loading" class="loading hidden">Loading...</div>
      <div id="empty-state" class="empty-state hidden">
        <span>🎉</span>
        <p>No todos here! Add one above.</p>
      </div>
      <ul id="todo-list"></ul>
    </section>

    <!-- ── Toast Notification ── -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="app.js"></script>
</body>
</html>
